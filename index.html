<!doctype html>
<html lang="en-GB">

<head>
  <title>Web 3D Component</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    html {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-size: 1.5em;
      display: block;
      margin: 0;
      width: 100%;
      height: 100%;
    }

    .full {
      display: block;
      padding-top: 10px;
      padding-left: 5%;
      padding-right: 5%;
      padding-bottom: 10px;
      width: 90%;
      height: 90%;
    }
  </style>
  <script type="module" src="/src/web-3d-component.ts"></script>
</head>

<body>
  <button class="web-3d-component-btn" id="reset">Reset</button>
  <button class="web-3d-component-btn" id="clear">Clear</button>
  <button class="web-3d-component-btn" id="scene-1">Scene 1</button>
  <button class="web-3d-component-btn" id="scene-2">Scene 2</button>
  <button class="web-3d-component-btn" id="scene-3">Scene 3</button>
  <button class="web-3d-component-btn" id="scene-4">Scene 4</button>
  <button class="web-3d-component-btn" id="switch-orbit-controls">Switch orbit controls</button>
  <button class="web-3d-component-btn" id="switch-fp-controls">Switch FP controls</button>

  <web-3d-component id="wc" class="full"></web-3d-component>
  <script>
    const btns = document.querySelectorAll('.web-3d-component-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', evt => {
        document.dispatchEvent(new CustomEvent('web-3d-component-event', {
          detail: {
            eventId: evt.currentTarget.id
          }
        }));
      })
    })
  </script>
</body>

</html>
